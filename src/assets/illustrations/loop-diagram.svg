<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" fill="none" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">The Synapse Loop Diagram</title>
  <desc id="loop-desc">A continuous circular pedagogic cycle with four interconnected nodes: Learn, Teach, Build, and Show.</desc>

  <!-- Base circumference ring -->
  <circle cx="220" cy="220" r="160" stroke="var(--hair)" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.8" />

  <!-- Active vermilion flow arcs with directional momentum -->
  <path d="M 220 60 A 160 160 0 0 1 380 220" stroke="var(--spark)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 380 220 A 160 160 0 0 1 220 380" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
  <path d="M 220 380 A 160 160 0 0 1 60 220" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
  <path d="M 60 220 A 160 160 0 0 1 220 60" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Clockwise directional chevrons -->
  <path d="M 328 100 L 338 107 L 332 118" stroke="var(--spark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 338 328 L 333 338 L 321 334" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5" fill="none" />
  <path d="M 112 338 L 102 331 L 108 320" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5" fill="none" />
  <path d="M 102 112 L 107 102 L 119 106" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5" fill="none" />

  <!-- Center cadence core -->
  <circle cx="220" cy="220" r="52" fill="var(--paper)" stroke="var(--hair)" stroke-width="1.2" />
  <circle cx="220" cy="220" r="46" fill="none" stroke="var(--hair)" stroke-width="0.8" stroke-dasharray="2 3" />

  <!-- 4 Nodal markers -->
  <!-- 12 O'Clock: LEARN (Active Spark Node) -->
  <circle cx="220" cy="60" r="10" fill="var(--paper)" stroke="var(--spark)" stroke-width="2.5" />
  <circle cx="220" cy="60" r="4.5" fill="var(--spark)" />

  <!-- 3 O'Clock: TEACH -->
  <circle cx="380" cy="220" r="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="2" />
  <circle cx="380" cy="220" r="3.5" fill="var(--ink)" />

  <!-- 6 O'Clock: BUILD -->
  <circle cx="220" cy="380" r="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="2" />
  <circle cx="220" cy="380" r="3.5" fill="var(--ink)" />

  <!-- 9 O'Clock: SHOW -->
  <circle cx="60" cy="220" r="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="2" />
  <circle cx="60" cy="220" r="3.5" fill="var(--ink)" />
</svg>
