<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="worlds-title worlds-desc">
  <title id="worlds-title">Three Worlds Diagnostic Diagram</title>
  <desc id="worlds-desc">Three intersecting domains — School, Coaching, and Innovation — joined at the central overlap by Synapse.</desc>

  <!-- Background framing hairline border -->
  <rect x="4" y="4" width="312" height="312" rx="4" stroke="var(--hair)" stroke-width="1" stroke-opacity="0.6" fill="var(--paper)" fill-opacity="0.5" />

  <!-- The 3 intersecting domains -->
  <!-- Domain 1: School (Top Left) -->
  <circle cx="122" cy="138" r="76" stroke="var(--hair)" stroke-width="1.5" fill="none" />
  <circle cx="122" cy="138" r="70" stroke="var(--hair)" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5" fill="none" />

  <!-- Domain 2: Coaching (Top Right) -->
  <circle cx="198" cy="138" r="76" stroke="var(--hair)" stroke-width="1.5" fill="none" />
  <circle cx="198" cy="138" r="70" stroke="var(--hair)" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5" fill="none" />

  <!-- Domain 3: Innovation (Bottom Center) -->
  <circle cx="160" cy="204" r="76" stroke="var(--hair)" stroke-width="1.5" fill="none" />
  <circle cx="160" cy="204" r="70" stroke="var(--hair)" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5" fill="none" />

  <!-- Domain Apex Accent Dots -->
  <circle cx="72" cy="110" r="3.5" fill="var(--ink)" fill-opacity="0.6" />
  <circle cx="248" cy="110" r="3.5" fill="var(--ink)" fill-opacity="0.6" />
  <circle cx="160" cy="262" r="3.5" fill="var(--ink)" fill-opacity="0.6" />

  <!-- Connecting dashed lines to center -->
  <line x1="72" y1="110" x2="132" y2="144" stroke="var(--hair)" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6" />
  <line x1="248" y1="110" x2="188" y2="144" stroke="var(--hair)" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6" />
  <line x1="160" y1="262" x2="160" y2="192" stroke="var(--hair)" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6" />

  <!-- Central Overlap (Synapse) -->
  <circle cx="160" cy="160" r="36" fill="var(--paper)" stroke="var(--spark)" stroke-width="1" stroke-dasharray="2 3" />
  <circle cx="160" cy="160" r="30" fill="var(--spark)" />
  <circle cx="160" cy="160" r="28" fill="none" stroke="var(--paper)" stroke-width="1" stroke-opacity="0.4" />
</svg>
